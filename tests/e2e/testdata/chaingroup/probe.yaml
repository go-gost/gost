services:
- name: proxy
  addr: :8080
  handler:
    type: http
    chainGroup:
      chains:
        - chain: chain-live
          probe:
            type: tcp
            addr: 127.0.0.1:18081
            interval: 3s
        - chain: chain-dead
          probe:
            type: tcp
            addr: 127.0.0.1:18082
            interval: 3s
      selector:
        strategy: round
        maxFails: 1
        failTimeout: 10s
  listener:
    type: tcp

# Live relay: forwards to echo server.
- name: relay
  addr: 127.0.0.1:18081
  handler:
    type: http
  listener:
    type: tcp

chains:
- name: chain-live
  hops:
  - name: hop-live
    nodes:
    - name: n-live
      addr: 127.0.0.1:18081
      connector:
        type: http

# Dead chain: relay never listens here. TCP probe marks the chain entry so
# FailFilter excludes it before real traffic reaches it.
- name: chain-dead
  hops:
  - name: hop-dead
    nodes:
    - name: n-dead
      addr: 127.0.0.1:18082
      connector:
        type: http
