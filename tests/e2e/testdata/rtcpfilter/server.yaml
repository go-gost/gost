# Public-facing gost: tunnel handler with an ingress table mapping two
# hostnames to the SAME tunnel endpoint (multi-TCP-service sharing one tunnel
# ID — the gost#898 scenario). Requests to the HTTP entrypoint are routed by
# their Host header through the ingress table to the matching tunnel.
services:
  - name: service-0
    addr: ":8421"
    handler:
      type: tunnel
      metadata:
        entrypoint: ":8420"
        ingress: ingress-0
    listener:
      type: tcp

ingresses:
  - name: ingress-0
    rules:
      - hostname: example.local
        endpoint: 6be39003-f4fa-49e4-a6ef-1997684d160e
      - hostname: other.local
        endpoint: 6be39003-f4fa-49e4-a6ef-1997684d160e

log:
  level: debug
